# Configuración del proyecto. Los valores reproducen los usados en los notebooks y en el
# modelo publicado (versión v2 en Hugging Face Hub). Ninguna clave o secreto va en este archivo:
# las credenciales se leen de variables de entorno (ver deploy/.env.example).

semilla: 17

rutas:
  colab: /content/drive/MyDrive/PI_G17
  kaggle: /kaggle/working/PI_G17
  datos_procesados: data/processed
  modelos: models
  resultados: results

clases: [legitimo, spam, phishing]

preparacion:
  # Decisiones del EDA (notebooks 01 y 02). Corpus excluidos: Nazario en CSV (perdió los enlaces y
  # duplica a Nazario anual), Enron y Ling (texto tokenizado que destruye las URL y sin fecha).
  grupos_excluidos: [Nazario, Enron, Ling]
  grupos_con_filtro_idioma: [phishing_pot, nazario_anual]
  idioma: en
  min_len_plano: 20
  clases: {legitimo: 0, spam: 1, phishing: 2}
  proporciones: {train: 0.70, val: 0.15, test: 0.15}
  anio_corte_temporal: 2025
  # Dominio del buzón del autor de Nazario anual: delataba la fuente (sonda de fuga)
  dominios_propios: {nazario_anual: [monkey.org, monkey]}

texto:
  max_chars_baseline: 5000      # truncado declarado de la entrada TF-IDF
  max_len_distilbert: 256       # tokens en inferencia

baseline:
  # TF-IDF de palabras (1-2 gramas) y de caracteres (3-5 gramas) + regresión logística
  palabras: {ngram_range: [1, 2], min_df: 3, max_df: 0.9, max_features: 100000}
  caracteres: {ngram_range: [3, 5], min_df: 5, max_features: 100000}
  c_busqueda: [0.5, 2.0, 8.0]   # C elegido en validación: 8.0
  max_iter: 2000

rama_url:
  max_urls_por_correo: 20
  top_tld: 50                   # TLD más frecuentes en train; el resto es "__otro__"
  xgboost:
    n_estimators: 1000
    learning_rate: 0.05
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    early_stopping_rounds: 50

distilbert:
  # Ajuste fino en GPU (notebooks 06 y 11 de notebooks/experimentos)
  modelo_ingles: distilbert-base-uncased
  modelo_multilingue: distilbert-base-multilingual-cased
  max_len: 256
  batch: 32
  epocas: 3
  learning_rate: 5.0e-5
  warmup: 0.1
  weight_decay: 0.01
  paciencia: 1

fusion:
  variante: V3
  fpr_maximo_validacion: 0.01   # política D9: umbral más bajo con FPR <= 1 % en validación
  umbral_operativo_en: 0.8586   # decisión D27: FPR 1,3 % en correo corporativo (Enron)

optimizacion:
  # Workshop 2 de la Semana 5 (notebook 04). Validación cruzada solo sobre entrenamiento.
  rama_url:
    n_trials: 60
    timeout_s: 1800
    n_folds: 5
    repeticiones_comparacion: 3
  baseline:
    n_trials: 30
    timeout_s: 1500
    muestra_train: 6000
    n_folds: 3

evaluacion:
  # Workshop 1 de la Semana 5 (notebook 05): escenarios de estrés sobre el modelo final
  muestra_estres: 2000
  repeticiones: 3
  caida_recall_maxima: 0.05
  remuestreos_bootstrap: 2000

metas_smart:
  f1_macro: 0.90
  recall_phishing: 0.95
  fpr_maximo: 0.02
  latencia_ms: 1000
  alertas_integradas: 0.90
  reduccion_triaje: 0.40
