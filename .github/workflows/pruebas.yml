# Integración continua: estilo y pruebas automáticas en cada cambio de la rama principal.
# Las pruebas usan componentes simulados; no necesitan el modelo, los datos ni claves.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Estilo
        run: ruff check .
      - name: Pruebas
        run: pytest
